# Render Blueprint configuration for Akhil's Portfolio Web Application
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: portfolio
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: USE_LIGHTWEIGHT_EMBEDDINGS
        value: "1"
      - key: FAST_EVAL_MODE
        value: "0"
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL
        value: sakhil2027@gmail.com
